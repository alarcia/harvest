name: Deploy to Raspberry Pi

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Create .env file
        run: |
          echo "DJANGO_SECRET_KEY=${{ secrets.DJANGO_SECRET_KEY }}" > .env
          echo "DJANGO_ALLOWED_HOSTS=${{ vars.DJANGO_ALLOWED_HOSTS }}" >> .env
          echo "HOST_DB_PATH=${{ vars.HOST_DB_PATH }}" >> .env
          echo "DEPLOY_UID=$(id -u)" >> .env
          echo "DEPLOY_GID=$(id -g)" >> .env
          echo "GMAIL_IMAP_USER=${{ vars.GMAIL_IMAP_USER }}" >> .env
          echo "GMAIL_IMAP_APP_PASSWORD=${{ secrets.GMAIL_IMAP_APP_PASSWORD }}" >> .env
          # Draft suggestions. Unset until the feature is switched on, which is
          # exactly what the app expects — it reports itself unavailable rather
          # than failing. Add SUGGEST_API_KEY as an Actions *secret*, the other
          # two as Actions *variables*, same split as the IMAP pair above.
          echo "SUGGEST_API_URL=${{ vars.SUGGEST_API_URL }}" >> .env
          echo "SUGGEST_API_KEY=${{ secrets.SUGGEST_API_KEY }}" >> .env
          echo "SUGGEST_MODEL=${{ vars.SUGGEST_MODEL }}" >> .env
          echo "SUGGEST_API_HEADERS=${{ vars.SUGGEST_API_HEADERS }}" >> .env

      - name: Keep the secrets out of other users' reach
        run: chmod 600 .env

      - name: Initialize data directory
        run: mkdir -p ${{ vars.HOST_DB_PATH }}

      - name: Build image
        run: docker compose build

      # Inside the image about to ship, before it replaces anything: a failure
      # stops here and the running containers keep their old image. No volume,
      # so the production database is never touched. DJANGO_DEBUG=True matches
      # a dev run — with it off, SECURE_SSL_REDIRECT answers the test client's
      # plain-http requests with a 301. The .eml fixtures are gitignored, so
      # the tests built on them skip here.
      - name: Run tests
        run: |
          docker run --rm -e DJANGO_DEBUG=True -e DJANGO_SECRET_KEY=ci-test-only \
            -e TZ=Europe/Madrid harvest python manage.py test --noinput

      - name: Run Docker
        run: docker compose up -d
