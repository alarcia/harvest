services:
  web:
    build: .
    image: harvest
    container_name: harvest-web
    restart: unless-stopped
    user: "${DEPLOY_UID}:${DEPLOY_GID}"
    ports:
      # Loopback only. A bare "8000:8000" binds 0.0.0.0, which put the whole
      # app on the home LAN beside the tunnel — and `SECURE_PROXY_SSL_HEADER`
      # trusts X-Forwarded-Proto from anyone, so a LAN request carrying the
      # right Host and that header got served without ever passing Cloudflare
      # Access. There is no login of our own behind it. Cloudflared reaches
      # this from the host; if it ever moves into a container of its own, drop
      # `ports` entirely and put the two on a shared Docker network.
      - "127.0.0.1:8000:8000"
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS}
      DJANGO_DB_PATH: /app/data/db.sqlite3
      # Log timestamps in the user's wall-clock time.
      TZ: Europe/Madrid
      GMAIL_IMAP_USER: ${GMAIL_IMAP_USER:-}
      GMAIL_IMAP_APP_PASSWORD: ${GMAIL_IMAP_APP_PASSWORD:-}
      # The web has its own reason to reach the mailbox: the topbar's ⟳
      # ("procesar ahora") sweeps it on demand. Same flag as the worker below
      # so a manual sweep is the *same* sweep, cleanup included — otherwise it
      # would leave already-processed mail sitting in the inbox until the next
      # worker cycle came round to trash it.
      GMAIL_TRASH_PROCESSED: ${GMAIL_TRASH_PROCESSED:-true}
      # Draft suggestions (reviews module). Web only: a suggestion is asked for
      # from a request, never from the sweep loop. Empty ⇒ the feature reports
      # itself as unavailable instead of failing.
      SUGGEST_API_URL: ${SUGGEST_API_URL:-}
      SUGGEST_API_KEY: ${SUGGEST_API_KEY:-}
      SUGGEST_MODEL: ${SUGGEST_MODEL:-}
      SUGGEST_API_HEADERS: ${SUGGEST_API_HEADERS:-}
    volumes:
      - ${HOST_DB_PATH}:/app/data

  # Inbox scanner. One sweep right after start, then every INGEST_EVERY_SECONDS,
  # with an idle heartbeat in the logs between sweeps. This is the container the
  # user pulls the audit trail from — `docker logs -f harvest` — so it takes the
  # bare `harvest` name. The initial sleep lets web run migrations.
  ingest:
    image: harvest
    container_name: harvest
    restart: unless-stopped
    user: "${DEPLOY_UID}:${DEPLOY_GID}"
    depends_on:
      - web
    command: sh -c "sleep 15; exec python manage.py ingest --loop"
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_DEBUG: "False"
      DJANGO_DB_PATH: /app/data/db.sqlite3
      TZ: Europe/Madrid
      GMAIL_IMAP_USER: ${GMAIL_IMAP_USER:-}
      GMAIL_IMAP_APP_PASSWORD: ${GMAIL_IMAP_APP_PASSWORD:-}
      INGEST_EVERY_SECONDS: ${INGEST_EVERY_SECONDS:-600}
      # Move processed emails to Trash so the inbox self-cleans (30-day grace).
      GMAIL_TRASH_PROCESSED: ${GMAIL_TRASH_PROCESSED:-true}
    volumes:
      - ${HOST_DB_PATH}:/app/data
